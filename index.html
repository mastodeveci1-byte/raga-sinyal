<title>Raga Sinyal</title>
<style>
:root { --bg: #0c111b; --surface: #141b28; --line: #263043; --fg: #e8ecf4; --muted: #8f9ab0; --accent: #f2b53a; --short: #ff6b6b; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 "Segoe UI", system-ui, sans-serif; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
form { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.mark { width: 44px; height: 44px; border-radius: 12px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 20px; }
h1 { margin: 0; font-size: 20px; }
p { margin: 0; color: var(--muted); font-size: 13px; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
input[type=password] { font: 500 17px system-ui, sans-serif; color: var(--fg); background: #1b2433; border: 1px solid var(--line); border-radius: 11px; padding: 12px; }
.chk { flex-direction: row; align-items: center; gap: 8px; }
button { border: 0; border-radius: 11px; padding: 12px; font: 600 16px system-ui, sans-serif; background: var(--accent); color: #1b1300; cursor: pointer; }
button:disabled { opacity: .6; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.err { color: var(--short); font-size: 13px; min-height: 1em; }
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = "raga.key." + P.id;
async function open_(key) {
  const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct));
  const html = new TextDecoder().decode(buf);
  document.open(); document.write(html); document.close();
}
async function fromPassword(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
(async () => {
  let saved = null; try { saved = localStorage.getItem(KEY); } catch (_) {}
  if (saved) {
    try { await open_(await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"])); return; }
    catch (_) { try { localStorage.removeItem(KEY); } catch (e) {} }
  }
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value, err = document.getElementById("err"), go = document.getElementById("go");
  if (!pw) return;
  go.disabled = true; go.textContent = "Açılıyor…"; err.textContent = "";
  try {
    const key = await fromPassword(pw);
    if (document.getElementById("rem").checked) {
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      try { localStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); } catch (_) {}
    }
    await open_(key);
  } catch (_) {
    go.disabled = false; go.textContent = "Aç"; err.textContent = "Şifre yanlış.";
  }
});
})();
